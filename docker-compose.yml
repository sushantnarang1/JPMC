services:
  backend:
    build:
      context: ./backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-512}
      MODEL_OPS_CORS_ORIGINS: ${MODEL_OPS_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      MODEL_OPS_PRODUCTION_APPROVED_MODELS: ${MODEL_OPS_PRODUCTION_APPROVED_MODELS:-}
      MODEL_OPS_GPU_ALLOWED_ENVIRONMENTS: ${MODEL_OPS_GPU_ALLOWED_ENVIRONMENTS:-staging,production}
      MODEL_OPS_DATABASE_PATH: /app/data/modelops.db
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - modelops_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  modelops_data:
